name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * *' # Automatically runs every night at 11:50 PM IST

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out your repository code
        uses: actions/checkout@v4

      - name: Sync Submissions Natively
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'Solutions'
          filter-duplicate-secs: '0' # FORCES the clean new repo to fetch your whole history
